name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bracket engine and import checks
        run: node --test
      - name: Scripts parse
        run: for f in js/*.js; do node --check "$f"; done
