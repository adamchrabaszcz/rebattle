name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bracket engine and import checks
        run: node --test
      - name: Modules parse
        run: find public/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Browser smoke test (headless Chrome, real CSP)
        run: node tests/browser/smoke.mjs
