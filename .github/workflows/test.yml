name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dev tools (pinned wrangler)
        run: npm ci
      - name: Node tests (engine, import, layout, timeline, routes, worker)
        run: node --test
        env:
          NODE_V8_COVERAGE: coverage/node
      - name: Modules parse
        run: find public/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Browser smoke test (headless Chrome, real CSP)
        run: node tests/browser/smoke.mjs
        env:
          NODE_V8_COVERAGE: coverage/node
          SMOKE_COVERAGE: coverage/browser
      - name: Coverage (both runs; table in the job summary)
        run: node tools/coverage.mjs coverage && cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-badge
          path: coverage/badge.svg
      - name: Worker builds (wrangler dry run)
        run: npx wrangler deploy --dry-run

  # The README's coverage badge: main's latest, kept on its own branch (badges) so
  # main never gets bot commits. The repo is private, so no outside badge service.
  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - name: Publish to the badges branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git add badge.svg
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "coverage badge for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
