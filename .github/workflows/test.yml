name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Dev tools (pinned wrangler)
        run: npm ci
      - name: Node tests (engine, import, layout, timeline, routes, worker)
        run: node --test
        env:
          NODE_V8_COVERAGE: coverage/node
      - name: Modules parse
        run: find public/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Browser smoke test (headless Chrome, real CSP)
        run: node tests/browser/smoke.mjs
        env:
          NODE_V8_COVERAGE: coverage/node
          SMOKE_COVERAGE: coverage/browser
      - name: Coverage report (both runs; table in the job summary)
        run: node tools/coverage.mjs coverage && cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Worker builds (wrangler dry run)
        run: npx wrangler deploy --dry-run
