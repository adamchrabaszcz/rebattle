name: release

# Every merge to main deploys (Cloudflare builds main). Once CI has passed on it, this
# tags the commit and publishes a GitHub release if the merge shipped a change
# (tools/release.mjs reads the Conventional Commits since the last tag), so what's
# live has a version and release notes.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(node tools/release.mjs)
          if [ -z "$version" ]; then echo "Nothing to release (docs, ci, chore… only)."; exit 0; fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA" 2>/dev/null || true)
          gh release create "v$version" --target "$SHA" --title "v$version" --generate-notes
          echo "Released v$version" >> "$GITHUB_STEP_SUMMARY"
          # The pull requests and issues it shipped get the milestone v$version and a comment.
          # The release is out already: a failure here only leaves the marks missing.
          node tools/release-marks.mjs "$version" "$previous" "$SHA" || echo "::warning::Could not mark the issues for v$version"
