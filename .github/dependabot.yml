# Actions are pinned to commit SHAs (CONTRIBUTING.md, "Checks"); Dependabot proposes updates as
# one grouped pull request a week that keeps the pins and updates the version comments.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # The dev tools (wrangler, package-lock.json). Security updates only: a limit of 0 opens no
  # weekly version updates, but gives the security pull requests this entry's `build` prefix
  # and lets Dependabot rebase them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
